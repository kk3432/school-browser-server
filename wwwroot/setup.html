<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>初始化向导 · 校园浏览器服务端</title>
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <header class="page-header">
    <img src="logo.png" alt="校园浏览器 logo" class="page-logo">
    <div>
      <h1>校园浏览器服务端</h1>
      <p class="muted">首次启动 · 设置管理员账号与第一份配置，完成后写入本地数据库</p>
    </div>
  </header>

  <!-- 首次启动初始化向导 -->
  <section id="screen-setup">
    <div class="card">
      <h2>管理员账号</h2>
      <div class="grid">
        <label>管理员账号<input id="setup-username" autocomplete="username" placeholder="admin"></label>
        <label>登录密码（至少 6 位）<input id="setup-password" type="password" autocomplete="new-password"></label>
      </div>
    </div>

    <div class="card">
      <h3 class="section-title">门户与访问</h3>
      <div class="grid">
        <label>门户标题<input id="setup-title" value="校园门户"></label>
        <label>首页网址<input id="setup-home" placeholder="https://portal.example.edu.cn"></label>
        <label>管控模式
          <select id="setup-mode">
            <option value="whitelist">白名单（只放行规则内网址，推荐）</option>
            <option value="blacklist">黑名单（默认全放行，仅拦截规则内网址）</option>
          </select>
        </label>
        <label>轮询间隔（秒，30~86400）<input id="setup-interval" type="number" value="300" min="30"></label>
      </div>
    </div>

    <div class="card">
      <h3 class="section-title">访问规则</h3>
      <div class="grid">
        <label class="full">白/黑名单规则（一行一条，支持 *.example.edu.cn、https://host/*）
          <textarea id="setup-rules" rows="4" placeholder="*.example.edu.cn&#10;https://jw.example.edu.cn/*"></textarea>
        </label>
      </div>
    </div>

    <div class="card">
      <h3 class="section-title">快捷书签</h3>
      <p class="muted">教师在 APP 工具栏一键打开；白名单模式下书签网址自动放行。</p>
      <div id="setup-bookmarks" class="bm-editor"></div>
      <button type="button" id="btn-setup-add-bm" class="ghost add-bm">+ 添加书签</button>
    </div>

    <div class="card">
      <h3 class="section-title">内置 HTML 页（可选）</h3>
      <p class="muted">初始化时创建；地址形如 <code>http://服务器IP:端口/h/页面片段</code>，写进书签即可打开。</p>
      <div id="setup-html" class="html-editor">
        <div class="grid">
          <label>页面名称<input id="setup-html-title" placeholder="如：期末考试安排"></label>
          <label>地址片段（小写字母/数字/短横线）<input id="setup-html-slug" placeholder="exam-2026"></label>
        </div>
        <label>HTML 内容<textarea id="setup-html-body" rows="6" spellcheck="false" placeholder="留空则不创建"></textarea></label>
      </div>
    </div>

    <div class="card">
      <h3 class="section-title">平板限制</h3>
      <div class="grid">
        <label class="chk"><input id="setup-hidden-entry" type="checkbox" checked>
          <span>允许平板打开隐藏管理入口<em>Logo 连点 5 次；关闭后仅能由服务器重新开启</em></span>
        </label>
        <label class="chk"><input id="setup-block-screenshot" type="checkbox" checked>
          <span>禁止截屏与录屏<em>FLAG_SECURE，开启后平板全局强制</em></span>
        </label>
        <label class="chk full"><input id="setup-require-photo" type="checkbox">
          <span>要求平板启动时拍前置照片并上传<em>未授权相机权限将无法进入浏览器</em></span>
        </label>
      </div>
    </div>

    <div class="card">
      <h3 class="section-title">允许唤醒的应用白名单</h3>
      <p class="muted">APP 工具栏「应用」按钮；网页内自定义 scheme 链接也按此表拉起。</p>
      <div id="setup-apps" class="app-editor"></div>
      <button type="button" id="btn-setup-add-app" class="ghost add-bm">+ 添加应用</button>
    </div>

    <div class="card">
      <h3 class="section-title">平板 6 位管理密码</h3>
      <p class="muted">可留空（之后可在「系统设置」里设置）。该密码与配置版本解耦。</p>
      <div class="grid">
        <label>平板 6 位管理密码（可留空）<input id="setup-pin" inputmode="numeric" maxlength="6" placeholder="6 位数字"></label>
      </div>
    </div>

    <div class="card actions-card">
      <button id="btn-setup" class="primary">完成初始化</button>
      <p id="setup-msg" class="msg"></p>
    </div>
  </section>
</div>
<script src="js/core.js"></script>
<script src="js/setup.js"></script>
</body>
</html>
